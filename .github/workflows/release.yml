name: Release

# A merge of a pull request "Release <version>" publishes that version. On
# each push to main this reads the module's version. When that version has
# no tag yet, it:
#
#   1. runs every gate and the unit tests on the merged commit;
#   2. makes the bill of materials (tools/New-VmfSbom.ps1: an SPDX 2.3
#      document of what the release contains and what the install pulls in);
#   3. tags the commit v<version> and pushes the tag;
#   4. publishes the GitHub Release with the bill of materials attached
#      (tools/Publish-VmfRelease.ps1: a draft first, published only when the
#      attachment is read back). Below 1.0.0 it is a pre-release.
#
# A push whose version already has a tag fails before anything: a released
# version is never released again, and this repository receives only release
# pull requests. The module version must equal README.md's "Version **x.y.z**"
# line (tools/_VmfReleaseVersion.ps1, the rule tools/New-VmfRelease.ps1 sets
# them with). The tools are the ones every release uses, so the rules have one
# copy.

on:
  push:
    branches: [main]

permissions:
  contents: read

# A release is never cancelled by a later push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish the release
    runs-on: windows-latest
    timeout-minutes: 180
    # Pushing the tag and making the release write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, so the step below can see whether the version has one.
          fetch-depth: 0

      - name: Read the version and look for its tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The manifest's version, refused unless README.md states the same
          # one (the rule tools/New-VmfRelease.ps1 sets them with).
          . ./tools/_VmfReleaseVersion.ps1
          $number = Get-VmfReleaseVersion -Root .
          $tag = "v$number"
          $known = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) { throw "git could not list the tags (exit $LASTEXITCODE)." }
          if ($known.Count) {
              throw "The tag $tag is already there, so this version is already released. A merge here must carry a new version: release it from the private repository."
          }
          Write-Host "The version $number has no tag yet, so this push releases it."
          "number=$number" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Bicep at the pinned version
        shell: pwsh
        run: |
          ./tools/Sync-VmfBicepVersion.ps1

      - name: Ensure Pester + PSScriptAnalyzer are present, at the pinned versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Install-WithRetry {
              param([string]$Name, [string]$Version)
              for ($attempt = 1; $attempt -le 4; $attempt++) {
                  try {
                      Install-Module $Name -RequiredVersion $Version -Force -Scope CurrentUser -SkipPublisherCheck
                      return
                  }
                  catch {
                      if ($attempt -eq 4) { throw }
                      $wait = [math]::Pow(2, $attempt) * 5
                      Write-Host "::warning::$Name $Version install attempt $attempt failed ($($_.Exception.Message.Split([char]10)[0])) - retrying in $wait s"
                      Start-Sleep -Seconds $wait
                  }
              }
          }
          foreach ($m in @(@('Pester', '5.9.1'), @('PSScriptAnalyzer', '1.25.0'))) {
              if (Get-Module -ListAvailable $m[0] | Where-Object { $_.Version -eq $m[1] }) {
                  Write-Host "$($m[0]) $($m[1]) already present"
                  continue
              }
              Install-WithRetry -Name $m[0] -Version $m[1]
          }

      - name: The checks must pass on the merged commit
        shell: pwsh
        run: |
          ./tools/Invoke-VmfTests.ps1

      - name: Make the bill of materials
        shell: pwsh
        env:
          VMF_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sbom = Join-Path $env:RUNNER_TEMP "migration-factory-$env:VMF_VERSION.spdx.json"
          ./tools/New-VmfSbom.ps1 -Version $env:VMF_VERSION -OutFile $sbom

      # The tag goes on only after the checks and the bill of materials, so a
      # failure above leaves no tag.
      - name: Tag the merged commit
        shell: pwsh
        env:
          VMF_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:VMF_TAG -m "Release $env:VMF_TAG"
          if ($LASTEXITCODE -ne 0) { throw "git could not make the tag $env:VMF_TAG (exit $LASTEXITCODE)." }
          git push origin "refs/tags/$env:VMF_TAG"
          if ($LASTEXITCODE -ne 0) { throw "git could not push the tag $env:VMF_TAG (exit $LASTEXITCODE)." }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VMF_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sbom = Join-Path $env:RUNNER_TEMP "migration-factory-$env:VMF_VERSION.spdx.json"
          ./tools/Publish-VmfRelease.ps1 -Repository $env:GITHUB_REPOSITORY -Version $env:VMF_VERSION -SbomPath $sbom
