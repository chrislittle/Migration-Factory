<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 770" width="1400" height="770" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>The parts of the product and what talks to what</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446e9b"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ac5f00"/></marker>
    <style>
      .zone { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .zone-label { fill: #6c6c6c; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      .box { fill: #ffffff; stroke: #446e9b; stroke-width: 2; }
      .box-soft { fill: #dae2eb; stroke: #446e9b; stroke-width: 2; }
      .store { fill: #ffffff; stroke: #446e9b; stroke-width: 2; stroke-dasharray: 5 3; }
      .name { fill: #2d2d2d; font-size: 17px; font-weight: 700; }
      .desc { fill: #495057; font-size: 13px; }
      .tech { fill: #6c6c6c; font-size: 11.5px; font-family: Consolas, 'Cascadia Mono', monospace; }
      .flow { stroke: #446e9b; stroke-width: 2.2; fill: none; marker-end: url(#a); }
      .flow-warn { stroke: #ac5f00; stroke-width: 2.2; fill: none; marker-end: url(#a2); }
      .pill { fill: #ffffff; stroke: #446e9b; stroke-width: 1; }
      .pill-text { fill: #446e9b; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .lbl-warn { fill: #ac5f00; font-size: 12px; font-weight: 600; }
      .band { fill: #446e9b; }
      .band-text { fill: #ffffff; font-size: 22px; font-weight: 700; }
      .band-sub { fill: rgba(255,255,255,.9); font-size: 14px; }
    </style>
  </defs>

  <rect class="band" x="0" y="0" width="1400" height="70"/>
  <text class="band-text" x="32" y="32">The parts, and what talks to what</text>
  <text class="band-sub" x="32" y="55">Everything runs in your subscription. Every part signs in with an identity Azure manages. No secret anywhere.</text>

  <!-- zones -->
  <rect class="zone" x="32" y="100" width="268" height="280" rx="12"/>
  <text class="zone-label" x="52" y="126">THE PERSON'S BROWSER</text>
  <rect class="zone" x="32" y="410" width="268" height="120" rx="12"/>
  <text class="zone-label" x="52" y="436">MICROSOFT ENTRA ID</text>
  <rect class="zone" x="360" y="100" width="1008" height="460" rx="12"/>
  <text class="zone-label" x="380" y="126">YOUR SUBSCRIPTION, ONE RESOURCE GROUP</text>
  <rect class="zone" x="360" y="600" width="1008" height="140" rx="12"/>
  <text class="zone-label" x="380" y="626">YOUR VIRTUAL MACHINES, WHEREVER THEY ARE</text>

  <!-- row 1 -->
  <g transform="translate(60,170)">
    <rect class="box-soft" width="210" height="180" rx="10"/>
    <text class="name" x="18" y="34">Dashboard</text>
    <text class="desc" x="18" y="60">Static web pages. Signs the</text>
    <text class="desc" x="18" y="78">person in. Asks the service</text>
    <text class="desc" x="18" y="96">for every record it shows</text>
    <text class="desc" x="18" y="114">and every action.</text>
    <text class="tech" x="18" y="150">App Service, free plan</text>
    <text class="tech" x="18" y="166">no server code, no secret</text>
  </g>
  <g transform="translate(380,170)">
    <rect class="box-soft" width="220" height="180" rx="10"/>
    <text class="name" x="18" y="34">Service</text>
    <text class="desc" x="18" y="60">Records every decision.</text>
    <text class="desc" x="18" y="78">Checks the caller's role.</text>
    <text class="desc" x="18" y="96">Starts the engine for a wave.</text>
    <text class="desc" x="18" y="114">Timers: schedules, cleanup.</text>
    <text class="tech" x="18" y="150">Azure Functions, PowerShell</text>
    <text class="tech" x="18" y="166">platform sign-in required</text>
  </g>
  <g transform="translate(720,170)">
    <rect class="store" width="210" height="180" rx="10"/>
    <text class="name" x="18" y="34">Run store</text>
    <text class="desc" x="18" y="60">Every record: assessments,</text>
    <text class="desc" x="18" y="78">plans, each machine's state,</text>
    <text class="desc" x="18" y="96">approvals, the log.</text>
    <text class="desc" x="18" y="114">The only shared state.</text>
    <text class="tech" x="18" y="150">one storage container</text>
    <text class="tech" x="18" y="166">identity sign-in, no keys</text>
  </g>
  <g transform="translate(1050,170)">
    <rect class="box-soft" width="290" height="180" rx="10"/>
    <text class="name" x="18" y="34">Engine</text>
    <text class="desc" x="18" y="60">Runs only while a wave runs.</text>
    <text class="desc" x="18" y="78">Leases machines to workers.</text>
    <text class="desc" x="18" y="96">Each worker: copy, prepare, stop,</text>
    <text class="desc" x="18" y="114">move, start, check. Writes each step.</text>
    <text class="tech" x="18" y="150">Container Apps job, up to 4 containers</text>
    <text class="tech" x="18" y="166">the product's own managed identity</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(380,440)">
    <rect class="box" width="220" height="90" rx="10"/>
    <text class="name" x="18" y="30">Container registry</text>
    <text class="desc" x="18" y="54">Holds the engine's image,</text>
    <text class="desc" x="18" y="72">built there by the install.</text>
  </g>
  <g transform="translate(720,440)">
    <rect class="box" width="210" height="90" rx="10"/>
    <text class="name" x="18" y="30">Logs</text>
    <text class="desc" x="18" y="54">Log Analytics, Application</text>
    <text class="desc" x="18" y="72">Insights. Every part writes here.</text>
  </g>
  <g transform="translate(1050,440)">
    <rect class="box" width="190" height="90" rx="10"/>
    <text class="name" x="18" y="30">Two custom roles</text>
    <text class="desc" x="18" y="54">Assess, and migrate. Granted</text>
    <text class="desc" x="18" y="72">by an administrator, as them.</text>
  </g>

  <!-- directory -->
  <g transform="translate(60,440)">
    <rect class="box" width="210" height="72" rx="10"/>
    <text class="name" x="18" y="30">Two registrations</text>
    <text class="desc" x="18" y="52">Sign-in, and the four roles.</text>
  </g>

  <!-- machines -->
  <g transform="translate(380,640)">
    <rect class="box" width="960" height="80" rx="10"/>
    <text class="name" x="18" y="30">Virtual machines</text>
    <text class="desc" x="18" y="54">Changed only where the migrate role was granted. Scripts run inside them through Azure's run command;</text>
    <text class="desc" x="18" y="70">each script reports facts, and the engine judges them against the plan.</text>
  </g>

  <!-- flows: every line runs in a gutter, never through a box -->
  <!-- dashboard -> service -->
  <path class="flow" d="M 270 200 L 380 200"/>
  <rect class="pill" x="271" y="208" width="108" height="30" rx="6"/>
  <text class="pill-text" x="325" y="220">reads, actions,</text><text class="pill-text" x="325" y="233">as the person</text>
  <!-- dashboard -> directory -->
  <path class="flow" d="M 245 350 L 245 440"/>
  <rect class="pill" x="213" y="385" width="64" height="20" rx="6"/>
  <text class="pill-text" x="245" y="399">signs in</text>
  <!-- service -> run store -->
  <path class="flow" d="M 600 260 L 720 260"/>
  <rect class="pill" x="606" y="268" width="108" height="30" rx="6"/>
  <text class="pill-text" x="660" y="280">reads records,</text><text class="pill-text" x="660" y="293">writes decisions</text>
  <!-- engine -> run store -->
  <path class="flow" d="M 1050 260 L 930 260"/>
  <rect class="pill" x="941" y="268" width="98" height="30" rx="6"/>
  <text class="pill-text" x="990" y="280">reads the plan,</text><text class="pill-text" x="990" y="293">writes state</text>
  <!-- service -> engine, under the store -->
  <path class="flow" d="M 490 350 L 490 390 L 1150 390 L 1150 350"/>
  <rect class="pill" x="743" y="380" width="164" height="20" rx="6"/>
  <text class="pill-text" x="825" y="394">starts one run per wave</text>
  <!-- registry -> engine, the next corridor down -->
  <path class="flow" d="M 545 440 L 545 415 L 1200 415 L 1200 350"/>
  <rect class="pill" x="1020" y="405" width="104" height="20" rx="6"/>
  <text class="pill-text" x="1072" y="419">pulls the image</text>
  <!-- engine -> machines, down the right-hand gutter -->
  <path class="flow-warn" d="M 1300 350 L 1300 640"/>
  <text class="lbl-warn" x="1290" y="585" text-anchor="end">changes and scripts, holding the two roles</text>
</svg>
