<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Migration Factory" fill="currentColor">
  <title>Migration Factory</title>
  <!--
    The browser tab icon (LOGO-SERVERS-1, design "C").
    The same arrangement as mark.svg - two waiting units, the moving unit in
    the middle and offset right, the arrow head ahead of it - drawn for 16
    pixels: larger units, no drive bays, the moving unit keeps its status
    light as a HOLE, and a heavier arrow head. Every page asks for logo.svg
    as its icon, so the icon kept this name.

    Its own colour, because a browser tab is not on the header's colour: the
    brand blue on a light browser, a lighter blue on a dark one.
  -->
  <style>
    svg { color: #446e9b; }
    @media (prefers-color-scheme: dark) { svg { color: #8fb3d9; } }
  </style>
  <rect x="1.5" y="1.5" width="17" height="9" rx="2" opacity=".5"/>
  <rect x="1.5" y="21.5" width="17" height="9" rx="2" opacity=".5"/>
  <path fill-rule="evenodd" d="M7.5 11.5H20.5A2 2 0 0 1 22.5 13.5V18.5A2 2 0 0 1 20.5 20.5H7.5A2 2 0 0 1 5.5 18.5V13.5A2 2 0 0 1 7.5 11.5ZM16.3 16A1.9 1.9 0 1 0 20.1 16A1.9 1.9 0 1 0 16.3 16Z"/>
  <path d="M25 11 L30 16 L25 21" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>