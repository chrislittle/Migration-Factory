<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 572" width="880" height="572" role="img" aria-label="What an install is. The install makes one resource group in your Azure subscription. It holds the dashboard, an App Service web app. It holds the web service, an Azure Functions function app. It holds the engine and the publish job, Container Apps jobs in a Container Apps environment. It holds the container registry with the product's image. It holds the run store, a storage account inside a network security perimeter. It holds a Log Analytics workspace and Application Insights, and three managed identities. In Microsoft Entra ID, the install makes two app registrations. The product gets its custom roles, VMF Assessment and VMF Migration, on the resource groups, subscriptions or management groups of your virtual machines. To start, run azd up, sign in, give the product access on the Admin page, and assess an estate.">
  <title>What an install is</title>
  <defs>
    <marker id="ia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9aa4b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Subscription -->
    <rect x="8.5" y="8.5" width="600" height="444" rx="12" fill="none" stroke="#9aa4b0" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="26" y="33" font-size="13" font-weight="700" fill="#9aa4b0">Your Azure subscription</text>
    <!-- Resource group -->
    <rect x="24.5" y="46.5" width="568" height="390" rx="10" fill="#303030" stroke="#9aa4b0"/>
    <g transform="translate(40 58)" fill="none" stroke="#759bc3" stroke-width="1.6"><rect x="0.8" y="0.8" width="16" height="13" rx="2"/><path d="M0.8 4.8 H16.8"/></g>
    <text x="64" y="71" font-size="14" font-weight="700" fill="#ffffff">Resource group</text>
    <text x="182" y="71" font-size="13" fill="#9aa4b0">rg-&lt;environment name&gt;</text>

    <!-- Row 1 -->
    <rect x="40.5" y="86.5" width="268" height="70" rx="8" fill="#0d1117" stroke="#9aa4b0"/>
    <g transform="translate(54 98)" fill="none" stroke="#759bc3" stroke-width="1.6" stroke-linejoin="round"><rect x="0.8" y="0.8" width="20" height="15" rx="2"/><path d="M0.8 5 H20.8"/><path d="M4 9.5 H11"/></g>
    <text x="86" y="112" font-size="14.5" font-weight="700" fill="#ffffff">Dashboard</text>
    <text x="54" y="136" font-size="12.5" fill="#9aa4b0">App Service web app</text>

    <rect x="316.5" y="86.5" width="260" height="70" rx="8" fill="#0d1117" stroke="#9aa4b0"/>
    <g transform="translate(330 97)" fill="none" stroke="#759bc3" stroke-width="1.6" stroke-linejoin="round"><path d="M12 0.8 L3 10 H10 L8 18 L17 8 H10 Z"/></g>
    <text x="356" y="112" font-size="14.5" font-weight="700" fill="#ffffff">Web service</text>
    <text x="330" y="136" font-size="12.5" fill="#9aa4b0">Azure Functions function app</text>

    <!-- Row 2 -->
    <rect x="40.5" y="166.5" width="268" height="78" rx="8" fill="#0d1117" stroke="#9aa4b0"/>
    <g transform="translate(54 177)" fill="none" stroke="#759bc3" stroke-width="1.6"><circle cx="10" cy="10" r="4"/><circle cx="10" cy="10" r="8.6" stroke-dasharray="4 2.8"/></g>
    <text x="86" y="192" font-size="14.5" font-weight="700" fill="#ffffff">Engine and publish job</text>
    <text x="54" y="214" font-size="12.5" fill="#9aa4b0">Container Apps jobs, in a</text>
    <text x="54" y="232" font-size="12.5" fill="#9aa4b0">Container Apps environment</text>

    <rect x="316.5" y="166.5" width="260" height="78" rx="8" fill="#0d1117" stroke="#9aa4b0"/>
    <g transform="translate(330 177)" fill="none" stroke="#759bc3" stroke-width="1.6" stroke-linejoin="round"><rect x="0.8" y="0.8" width="18" height="6" rx="1.5"/><rect x="0.8" y="7.8" width="18" height="6" rx="1.5"/><rect x="0.8" y="14.8" width="18" height="6" rx="1.5"/></g>
    <text x="356" y="192" font-size="14.5" font-weight="700" fill="#ffffff">Container registry</text>
    <text x="330" y="214" font-size="12.5" fill="#9aa4b0">It holds the product's image, built</text>
    <text x="330" y="232" font-size="12.5" fill="#9aa4b0">from its source in your subscription.</text>

    <!-- Row 3 -->
    <rect x="40.5" y="254.5" width="268" height="96" rx="8" fill="#0d1117" stroke="#9aa4b0"/>
    <rect x="46.5" y="260.5" width="256" height="84" rx="6" fill="none" stroke="#9aa4b0" stroke-dasharray="4 3"/>
    <g transform="translate(58 270)" fill="none" stroke="#759bc3" stroke-width="1.6"><ellipse cx="9" cy="3.5" rx="8.2" ry="2.8"/><path d="M0.8 3.5 V15.5 A8.2 2.8 0 0 0 17.2 15.5 V3.5"/><path d="M0.8 9.5 A8.2 2.8 0 0 0 17.2 9.5"/></g>
    <text x="86" y="285" font-size="14.5" font-weight="700" fill="#ffffff">Run store</text>
    <text x="58" y="308" font-size="12.5" fill="#9aa4b0">A storage account. A network</text>
    <text x="58" y="326" font-size="12.5" fill="#9aa4b0">security perimeter holds it.</text>

    <rect x="316.5" y="254.5" width="260" height="96" rx="8" fill="#0d1117" stroke="#9aa4b0"/>
    <g transform="translate(330 268)" fill="none" stroke="#759bc3" stroke-width="1.8" stroke-linecap="round"><path d="M2 18 V11"/><path d="M8 18 V4"/><path d="M14 18 V8"/><path d="M20 18 V1"/></g>
    <text x="360" y="285" font-size="14.5" font-weight="700" fill="#ffffff">Logs</text>
    <text x="330" y="308" font-size="12.5" fill="#9aa4b0">A Log Analytics workspace and</text>
    <text x="330" y="326" font-size="12.5" fill="#9aa4b0">Application Insights</text>

    <!-- Row 4 -->
    <rect x="40.5" y="360.5" width="536" height="60" rx="8" fill="#0d1117" stroke="#9aa4b0"/>
    <g transform="translate(54 377)" fill="none" stroke="#759bc3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="10" r="5.2"/><path d="M11 10 H21 M17 10 V14 M20.5 10 V13"/></g>
    <text x="86" y="386" font-size="14.5" font-weight="700" fill="#ffffff">Three managed identities</text>
    <text x="86" y="406" font-size="12.5" fill="#9aa4b0">One for the web service, and one for each job. They hold the product's access.</text>

    <!-- Arrows out of the subscription -->
    <line x1="577" y1="122" x2="624" y2="122" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ia)"/>
    <line x1="577" y1="390" x2="624" y2="390" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ia)"/>

    <!-- Entra ID -->
    <rect x="628.5" y="8.5" width="243" height="196" rx="10" fill="#303030" stroke="#9aa4b0"/>
    <g transform="translate(646 24)" fill="none" stroke="#759bc3" stroke-width="1.6" stroke-linejoin="round"><path d="M9 0.8 L17.2 4.5 V10 C17.2 15 13.5 18 9 19.2 C4.5 18 0.8 15 0.8 10 V4.5 Z"/></g>
    <text x="674" y="39" font-size="14.5" font-weight="700" fill="#ffffff">Microsoft Entra ID</text>
    <text x="646" y="68" font-size="12.5" font-weight="600" fill="#ffffff">Two app registrations</text>
    <text x="646" y="94" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#759bc3">vmf-dashboard-&lt;name&gt;</text>
    <text x="646" y="113" font-size="12.5" fill="#9aa4b0">It signs people in to the dashboard.</text>
    <text x="646" y="143" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#759bc3">vmf-api-&lt;name&gt;</text>
    <text x="646" y="162" font-size="12.5" fill="#9aa4b0">It guards the web service.</text>
    <text x="646" y="188" font-size="12.5" fill="#9aa4b0">A person needs a role to sign in.</text>

    <!-- Your machines -->
    <rect x="628.5" y="220.5" width="243" height="232" rx="10" fill="#303030" stroke="#9aa4b0"/>
    <g transform="translate(646 236)" fill="none" stroke="#759bc3" stroke-width="1.6" stroke-linejoin="round"><rect x="0.8" y="0.8" width="18" height="7" rx="1.5"/><rect x="0.8" y="10.8" width="18" height="7" rx="1.5"/></g>
    <text x="674" y="251" font-size="14.5" font-weight="700" fill="#ffffff">Your virtual machines</text>
    <text x="646" y="278" font-size="12.5" fill="#9aa4b0">In the resource groups, subscriptions</text>
    <text x="646" y="296" font-size="12.5" fill="#9aa4b0">or management groups you choose.</text>
    <line x1="646" y1="310" x2="854" y2="310" stroke="#9aa4b0"/>
    <text x="646" y="332" font-size="12.5" fill="#9aa4b0">The custom roles of the product:</text>
    <text x="646" y="356" font-size="12.5" font-weight="700" fill="#ffffff">VMF Assessment</text>
    <text x="646" y="374" font-size="12.5" fill="#9aa4b0">It reads the machines.</text>
    <text x="646" y="398" font-size="12.5" font-weight="700" fill="#ffffff">VMF Migration</text>
    <text x="646" y="416" font-size="12.5" fill="#9aa4b0">It moves a machine you approve.</text>
    <text x="646" y="440" font-size="12" fill="#9aa4b0">The install or Admin page gives them.</text>

    <!-- The first four steps -->
    <text x="8" y="486" font-size="13" font-weight="700" fill="#9aa4b0">From install to first assessment</text>
    <g>
      <rect x="8.5" y="498.5" width="200" height="64" rx="10" fill="#303030" stroke="#9aa4b0"/>
      <circle cx="32" cy="530" r="12" fill="none" stroke="#759bc3" stroke-width="1.6"/><text x="32" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#759bc3">1</text>
      <text x="54" y="525" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#ffffff">azd up</text>
      <text x="54" y="545" font-size="12.5" fill="#9aa4b0">About 20 minutes.</text>
    </g>
    <line x1="211" y1="530" x2="225" y2="530" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ia)"/>
    <g>
      <rect x="228.5" y="498.5" width="200" height="64" rx="10" fill="#303030" stroke="#9aa4b0"/>
      <circle cx="252" cy="530" r="12" fill="none" stroke="#759bc3" stroke-width="1.6"/><text x="252" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#759bc3">2</text>
      <text x="274" y="525" font-size="14" font-weight="700" fill="#ffffff">Sign in</text>
      <text x="274" y="545" font-size="12.5" fill="#9aa4b0">Open the dashboard.</text>
    </g>
    <line x1="431" y1="530" x2="445" y2="530" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ia)"/>
    <g>
      <rect x="448.5" y="498.5" width="200" height="64" rx="10" fill="#303030" stroke="#9aa4b0"/>
      <circle cx="472" cy="530" r="12" fill="none" stroke="#759bc3" stroke-width="1.6"/><text x="472" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#759bc3">3</text>
      <text x="494" y="525" font-size="14" font-weight="700" fill="#ffffff">Give access</text>
      <text x="494" y="545" font-size="12.5" fill="#9aa4b0">Use the Admin page.</text>
    </g>
    <line x1="651" y1="530" x2="665" y2="530" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ia)"/>
    <g>
      <rect x="668.5" y="498.5" width="203" height="64" rx="10" fill="#303030" stroke="#9aa4b0"/>
      <circle cx="692" cy="530" r="12" fill="none" stroke="#759bc3" stroke-width="1.6"/><text x="692" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#759bc3">4</text>
      <text x="714" y="525" font-size="14" font-weight="700" fill="#ffffff">Assess</text>
      <text x="714" y="545" font-size="12.5" fill="#9aa4b0">Select Assess an estate.</text>
    </g>
  </g>
</svg>
