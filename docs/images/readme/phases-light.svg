<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Assess, Plan, Migrate, Validate. A person approves before Migrate. On a failure, the product rolls the machine back from the first safety copy.">
  <title>The four phases of a migration</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6c6c6c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#ac5f00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Cards -->
    <g>
      <rect x="8.5" y="20.5" width="170" height="130" rx="10" fill="#f8f9fa" stroke="#6c6c6c"/>
      <circle cx="31" cy="46" r="12" fill="#dae2eb"/><text x="31" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2c3e">1</text>
      <text x="51" y="52" font-size="18" font-weight="700" fill="#2d2d2d">Assess</text>
      <text x="20" y="82" font-size="13" fill="#6c6c6c">It reads your estate.</text>
      <text x="20" y="100" font-size="13" fill="#6c6c6c">It says which machines</text>
      <text x="20" y="118" font-size="13" fill="#6c6c6c">can move, and why.</text>
    </g>
    <g>
      <rect x="218.5" y="20.5" width="170" height="130" rx="10" fill="#f8f9fa" stroke="#6c6c6c"/>
      <circle cx="241" cy="46" r="12" fill="#dae2eb"/><text x="241" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2c3e">2</text>
      <text x="261" y="52" font-size="18" font-weight="700" fill="#2d2d2d">Plan</text>
      <text x="230" y="82" font-size="13" fill="#6c6c6c">You choose a target for</text>
      <text x="230" y="100" font-size="13" fill="#6c6c6c">each machine. It makes</text>
      <text x="230" y="118" font-size="13" fill="#6c6c6c">waves and checks the</text>
      <text x="230" y="136" font-size="13" fill="#6c6c6c">quota of each wave.</text>
    </g>
    <g>
      <rect x="488.5" y="20.5" width="170" height="130" rx="10" fill="#f8f9fa" stroke="#6c6c6c"/>
      <circle cx="511" cy="46" r="12" fill="#dae2eb"/><text x="511" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2c3e">3</text>
      <text x="531" y="52" font-size="18" font-weight="700" fill="#2d2d2d">Migrate</text>
      <text x="500" y="82" font-size="13" fill="#6c6c6c">It takes safety copies of</text>
      <text x="500" y="100" font-size="13" fill="#6c6c6c">the disks first. Then it</text>
      <text x="500" y="118" font-size="13" fill="#6c6c6c">prepares, moves and</text>
      <text x="500" y="136" font-size="13" fill="#6c6c6c">starts each machine.</text>
    </g>
    <g>
      <rect x="698.5" y="20.5" width="170" height="130" rx="10" fill="#f8f9fa" stroke="#6c6c6c"/>
      <circle cx="721" cy="46" r="12" fill="#dae2eb"/><text x="721" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2c3e">4</text>
      <text x="741" y="52" font-size="18" font-weight="700" fill="#2d2d2d">Validate</text>
      <text x="710" y="82" font-size="13" fill="#6c6c6c">It checks each machine</text>
      <text x="710" y="100" font-size="13" fill="#6c6c6c">on its new size. It rolls</text>
      <text x="710" y="118" font-size="13" fill="#6c6c6c">back a machine that</text>
      <text x="710" y="136" font-size="13" fill="#6c6c6c">does not pass.</text>
    </g>
    <!-- Arrows -->
    <line x1="182" y1="85" x2="213" y2="85" stroke="#6c6c6c" stroke-width="1.8" marker-end="url(#ah)"/>
    <line x1="392" y1="85" x2="407" y2="85" stroke="#6c6c6c" stroke-width="1.8" marker-end="url(#ah)"/>
    <line x1="469" y1="85" x2="483" y2="85" stroke="#6c6c6c" stroke-width="1.8" marker-end="url(#ah)"/>
    <line x1="662" y1="85" x2="693" y2="85" stroke="#6c6c6c" stroke-width="1.8" marker-end="url(#ah)"/>
    <!-- Approval gate -->
    <rect x="419" y="65" width="40" height="40" rx="6" transform="rotate(45 439 85)" fill="#d8f0d3" stroke="#2c8418" stroke-width="1.5"/>
    <path d="M430 85 L436 91 L448 79" fill="none" stroke="#2c8418" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="439" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#18480d">A person</text>
    <text x="439" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#18480d">approves</text>
    <!-- Rollback path -->
    <path d="M783 154 V180 H573 V158" fill="none" stroke="#ac5f00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ahw)"/>
    <text x="678" y="200" text-anchor="middle" font-size="12.5" fill="#ac5f00">On a failure, the product rolls the machine</text>
    <text x="678" y="216" text-anchor="middle" font-size="12.5" fill="#ac5f00">back from the first safety copy.</text>
    <!-- The two rules -->
    <rect x="8.5" y="236.5" width="860" height="38" rx="19" fill="#d8f0d3"/>
    <g transform="translate(26 245)" fill="none" stroke="#2c8418" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="9" width="16" height="11" rx="2"/><path d="M4.5 9 V6 A4.5 4.5 0 0 1 13.5 6 V9"/>
    </g>
    <text x="54" y="261" font-size="14.5" font-weight="600" fill="#18480d">Nothing changes a machine until a person approves it.</text>
    <rect x="8.5" y="284.5" width="860" height="38" rx="19" fill="#dae2eb"/>
    <g transform="translate(26 293)" fill="none" stroke="#446e9b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 4 L1.5 8.5 L6 13"/><path d="M2 8.5 H12 A6 6 0 0 1 12 20.5 H6"/>
    </g>
    <text x="54" y="309" font-size="14.5" font-weight="600" fill="#1b2c3e">The product can roll back every machine.</text>
  </g>
</svg>
