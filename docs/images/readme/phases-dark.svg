<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Assess, Plan, Migrate, Validate. A person approves before Migrate. On a failure, the product rolls the machine back from the first safety copy.">
  <title>The four phases of a migration</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9aa4b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#f39c12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Cards -->
    <g>
      <rect x="8.5" y="20.5" width="170" height="130" rx="10" fill="#303030" stroke="#9aa4b0"/>
      <circle cx="31" cy="46" r="12" fill="#31363b"/><text x="31" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#7ea1c7">1</text>
      <text x="51" y="52" font-size="18" font-weight="700" fill="#ffffff">Assess</text>
      <text x="20" y="82" font-size="13" fill="#9aa4b0">It reads your estate.</text>
      <text x="20" y="100" font-size="13" fill="#9aa4b0">It says which machines</text>
      <text x="20" y="118" font-size="13" fill="#9aa4b0">can move, and why.</text>
    </g>
    <g>
      <rect x="218.5" y="20.5" width="170" height="130" rx="10" fill="#303030" stroke="#9aa4b0"/>
      <circle cx="241" cy="46" r="12" fill="#31363b"/><text x="241" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#7ea1c7">2</text>
      <text x="261" y="52" font-size="18" font-weight="700" fill="#ffffff">Plan</text>
      <text x="230" y="82" font-size="13" fill="#9aa4b0">You choose a target for</text>
      <text x="230" y="100" font-size="13" fill="#9aa4b0">each machine. It makes</text>
      <text x="230" y="118" font-size="13" fill="#9aa4b0">waves and checks the</text>
      <text x="230" y="136" font-size="13" fill="#9aa4b0">quota of each wave.</text>
    </g>
    <g>
      <rect x="488.5" y="20.5" width="170" height="130" rx="10" fill="#303030" stroke="#9aa4b0"/>
      <circle cx="511" cy="46" r="12" fill="#31363b"/><text x="511" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#7ea1c7">3</text>
      <text x="531" y="52" font-size="18" font-weight="700" fill="#ffffff">Migrate</text>
      <text x="500" y="82" font-size="13" fill="#9aa4b0">It takes safety copies of</text>
      <text x="500" y="100" font-size="13" fill="#9aa4b0">the disks first. Then it</text>
      <text x="500" y="118" font-size="13" fill="#9aa4b0">prepares, moves and</text>
      <text x="500" y="136" font-size="13" fill="#9aa4b0">starts each machine.</text>
    </g>
    <g>
      <rect x="698.5" y="20.5" width="170" height="130" rx="10" fill="#303030" stroke="#9aa4b0"/>
      <circle cx="721" cy="46" r="12" fill="#31363b"/><text x="721" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#7ea1c7">4</text>
      <text x="741" y="52" font-size="18" font-weight="700" fill="#ffffff">Validate</text>
      <text x="710" y="82" font-size="13" fill="#9aa4b0">It checks each machine</text>
      <text x="710" y="100" font-size="13" fill="#9aa4b0">on its new size. It rolls</text>
      <text x="710" y="118" font-size="13" fill="#9aa4b0">back a machine that</text>
      <text x="710" y="136" font-size="13" fill="#9aa4b0">does not pass.</text>
    </g>
    <!-- Arrows -->
    <line x1="182" y1="85" x2="213" y2="85" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ah)"/>
    <line x1="392" y1="85" x2="407" y2="85" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ah)"/>
    <line x1="469" y1="85" x2="483" y2="85" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ah)"/>
    <line x1="662" y1="85" x2="693" y2="85" stroke="#9aa4b0" stroke-width="1.8" marker-end="url(#ah)"/>
    <!-- Approval gate -->
    <rect x="419" y="65" width="40" height="40" rx="6" transform="rotate(45 439 85)" fill="#29443d" stroke="#00bc8c" stroke-width="1.5"/>
    <path d="M430 85 L436 91 L448 79" fill="none" stroke="#00bc8c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="439" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#00c291">A person</text>
    <text x="439" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#00c291">approves</text>
    <!-- Rollback path -->
    <path d="M783 154 V180 H573 V158" fill="none" stroke="#f39c12" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ahw)"/>
    <text x="678" y="200" text-anchor="middle" font-size="12.5" fill="#f39c12">On a failure, the product rolls the machine</text>
    <text x="678" y="216" text-anchor="middle" font-size="12.5" fill="#f39c12">back from the first safety copy.</text>
    <!-- The two rules -->
    <rect x="8.5" y="236.5" width="860" height="38" rx="19" fill="#29443d"/>
    <g transform="translate(26 245)" fill="none" stroke="#00bc8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="9" width="16" height="11" rx="2"/><path d="M4.5 9 V6 A4.5 4.5 0 0 1 13.5 6 V9"/>
    </g>
    <text x="54" y="261" font-size="14.5" font-weight="600" fill="#00c291">Nothing changes a machine until a person approves it.</text>
    <rect x="8.5" y="284.5" width="860" height="38" rx="19" fill="#31363b"/>
    <g transform="translate(26 293)" fill="none" stroke="#759bc3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 4 L1.5 8.5 L6 13"/><path d="M2 8.5 H12 A6 6 0 0 1 12 20.5 H6"/>
    </g>
    <text x="54" y="309" font-size="14.5" font-weight="600" fill="#7ea1c7">The product can roll back every machine.</text>
  </g>
</svg>
