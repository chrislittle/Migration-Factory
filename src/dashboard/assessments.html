<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migration Factory - Assessments</title>
<!--
  ASSESS-PAGE-1: the Assessments page. An assessment is not a run - it answers
  "what would this estate take?" on its own, it gets re-run and compared, and it
  is the thing reviewed and signed off before any migration is planned.

  READ-ONLY over the store, with the viewer own token, like the Reports page.
  The one action here leaves for the wizard, which is where planning happens.
-->
<script src="msal-browser.min.js"></script>
<!-- DARK-1: one stylesheet, Bootswatch Darkly. Rules in docs/ux.md;
     the short version is that no page carries CSS of its own. -->
<script src="theme.js"></script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body class="p-assessments">
<header class="topbar">
  <!-- The product name, not a control. It used to link to Migrations,
       which is ONE of the five areas, so the name of the whole product
       acted as a shortcut to
       a part of it. The navigation beside it names every area. -->
  <span class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-name"><span class="b-1">Migration</span><span class="b-2">Factory</span></span></span>
  <nav class="topnav"></nav>
  <span id="demo-tag" class="demo-tag" style="display:none">SAMPLE DATA</span>
</header>

<main class="wrap">
  <div id="err"></div>
  <!-- SIGNIN-1: filled by VmfHelp.showSignIn(). One card, on all of them. -->
  <div id="login-view"></div>

  <div id="app" style="display:none">
    <!-- PAGE-SCALE-ASSESSMENTS-1: the heading, its sentence and Assess an
         estate at the top right; then the count tiles and the one list
         (VmfHelp.listMount). -->
    <div class="pagehead">
      <div>
        <h1 id="list-title"></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="pagehead-actions">
        <button type="button" class="btn ghost" id="tidy-btn"></button>
        <a class="btn" id="assess-btn" href="wizard.html" style="text-decoration:none"></a>
      </div>
    </div>
    <div id="assessments-list"></div>
  </div>
</main>

<script src="help.js"></script>
<script src="assessment-report.js"></script>

<script src="assessments.js"></script>
  </body>
</html>
